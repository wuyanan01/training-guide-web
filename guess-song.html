<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎵 猜歌名 - 音乐小游戏</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1c1c2e;
    --primary: #7c3aed;
    --primary-glow: #a78bfa;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --gold: #f59e0b;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle animated background */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(245,158,11,0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 80%, rgba(34,197,94,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
    animation: bgShift 12s ease-in-out infinite;
  }
  @keyframes bgShift {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 20px;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== START SCREEN ===== */
  .start-screen {
    text-align: center;
  }
  .logo {
    width: 100px;
    height: 100px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, var(--primary), #a855f7);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    box-shadow: 0 0 60px rgba(124,58,237,0.3), 0 0 120px rgba(124,58,237,0.1);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .start-screen h1 {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #e2e8f0 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .start-screen .subtitle {
    font-size: 15px;
    color: var(--text2);
    margin-bottom: 40px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 40px;
    border-radius: 100px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: -0.2px;
    outline: none;
    position: relative;
    overflow: hidden;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    color: #fff;
    box-shadow: 0 4px 24px rgba(124,58,237,0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(124,58,237,0.5);
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .btn-secondary:hover {
    background: #242438;
  }

  /* ===== GAME SCREEN ===== */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .round-badge {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    background: var(--surface);
    padding: 6px 14px;
    border-radius: 100px;
  }
  .score-display {
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
  }
  .score-display span {
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
  }

  /* Player area */
  .player-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 24px;
    border: 1px solid rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
  }
  .player-card.playing {
    border-color: rgba(124,58,237,0.3);
    box-shadow: 0 0 40px rgba(124,58,237,0.1);
  }
  .album-art {
    width: 120px;
    height: 120px;
    border-radius: 20px;
    margin: 0 auto 20px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    transition: all 0.3s ease;
    position: relative;
  }
  .album-art.playing {
    animation: pulse 1.5s ease-in-out infinite;
    box-shadow: 0 0 40px rgba(124,58,237,0.3);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .album-art img {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    object-fit: cover;
    display: none;
  }
  .album-art img.loaded { display: block; }

  /* Equalizer */
  .equalizer {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    justify-content: center;
    height: 32px;
    margin-bottom: 16px;
  }
  .eq-bar {
    width: 4px;
    background: var(--primary);
    border-radius: 2px;
    transition: height 0.15s ease;
  }
  .eq-bar.active {
    animation: eqAnim 0.6s ease-in-out infinite;
  }
  .eq-bar:nth-child(1).active { animation-delay: 0s; }
  .eq-bar:nth-child(2).active { animation-delay: 0.1s; }
  .eq-bar:nth-child(3).active { animation-delay: 0.2s; }
  .eq-bar:nth-child(4).active { animation-delay: 0.15s; }
  .eq-bar:nth-child(5).active { animation-delay: 0.05s; }
  .eq-bar:nth-child(6).active { animation-delay: 0.25s; }
  .eq-bar:nth-child(7).active { animation-delay: 0.1s; }
  .eq-bar:nth-child(8).active { animation-delay: 0.2s; }
  @keyframes eqAnim {
    0%, 100% { height: 4px; }
    50% { height: 28px; }
  }

  .play-hint {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 16px;
  }
  .btn-play {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    cursor: pointer;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    box-shadow: 0 4px 24px rgba(124,58,237,0.4);
    transition: all 0.25s ease;
    color: #fff;
    outline: none;
  }
  .btn-play:hover { transform: scale(1.08); }
  .btn-play:active { transform: scale(0.94); }
  .btn-play.playing {
    background: var(--wrong);
    box-shadow: 0 4px 24px rgba(239,68,68,0.4);
  }

  /* Timer */
  .timer-bar {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    margin-top: 20px;
    overflow: hidden;
  }
  .timer-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    transition: width 0.1s linear;
    width: 100%;
  }
  .timer-fill.warning { background: var(--gold); }
  .timer-fill.danger { background: var(--wrong); }
  .timer-text {
    font-size: 13px;
    color: var(--text2);
    margin-top: 6px;
    text-align: right;
  }

  /* Options */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .option-btn {
    background: var(--surface);
    border: 2px solid rgba(255,255,255,0.04);
    border-radius: var(--radius-sm);
    padding: 18px 14px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    letter-spacing: -0.1px;
    outline: none;
    word-break: break-word;
  }
  .option-btn:hover {
    border-color: rgba(124,58,237,0.4);
    background: var(--surface2);
    transform: translateY(-1px);
  }
  .option-btn:active { transform: scale(0.97); }
  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.1);
    color: var(--correct);
    animation: popCorrect 0.4s ease;
  }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.1);
    color: var(--wrong);
    animation: shake 0.4s ease;
  }
  .option-btn:disabled { pointer-events: none; opacity: 0.6; }
  .option-btn.reveal-correct {
    border-color: var(--correct);
    opacity: 1 !important;
  }
  @keyframes popCorrect {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* Next round button */
  .next-area {
    text-align: center;
    margin-top: 16px;
    min-height: 52px;
  }

  /* ===== RESULT SCREEN ===== */
  .result-screen { text-align: center; }
  .result-icon {
    font-size: 72px;
    margin-bottom: 16px;
  }
  .result-screen h2 {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin: 32px 0;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 20px 12px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .stat-value {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold), #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text2);
    margin-top: 4px;
  }
  .result-rank {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    margin: 16px 0;
  }
  .result-screen .btn {
    margin: 8px;
  }

  /* ===== LOADING ===== */
  .loading-screen { text-align: center; }
  .spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--surface2);
    border-top-color: var(--primary);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-screen p {
    color: var(--text2);
    font-size: 14px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: var(--surface2);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    z-index: 100;
    transition: transform 0.3s ease;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Responsive */
  @media (max-width: 400px) {
    .options-grid { grid-template-columns: 1fr; }
    .start-screen h1 { font-size: 28px; }
    .album-art { width: 90px; height: 90px; border-radius: 16px; }
    .album-art img { border-radius: 16px; }
  }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="container">

  <!-- START SCREEN -->
  <div class="screen active" id="startScreen">
    <div class="start-screen">
      <div class="logo">🎵</div>
      <h1>猜歌名</h1>
      <p class="subtitle">听听看，你能猜出几首歌？</p>
      <button class="btn btn-primary" onclick="startGame()">
        🎮 开始游戏
      </button>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div class="screen" id="loadingScreen">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p id="loadingText">正在加载歌曲...</p>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <div class="game-header">
      <span class="round-badge" id="roundBadge">第 1/10 轮</span>
      <span class="score-display" id="scoreDisplay"><span>⭐</span> 0</span>
    </div>
    <div class="player-card" id="playerCard">
      <div class="album-art" id="albumArt">🎧</div>
      <div class="equalizer" id="equalizer">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
      <p class="play-hint" id="playHint">点击播放按钮试听歌曲片段</p>
      <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶</button>
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <p class="timer-text" id="timerText">已播放 0s / 可听 8s</p>
    </div>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="next-area" id="nextArea"></div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="resultScreen">
    <div class="result-screen">
      <div class="result-icon" id="resultIcon">🏆</div>
      <h2 id="resultTitle">太棒了！</h2>
      <p style="color:var(--text2);font-size:15px;" id="resultSubtitle"></p>
      <div class="result-stats">
        <div class="stat-card">
          <div class="stat-value" id="finalScore">0</div>
          <div class="stat-label">总分</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="finalCorrect">0</div>
          <div class="stat-label">正确</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="finalMax">0</div>
          <div class="stat-label">单轮最高</div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="startGame()">🔄 再来一局</button>
    </div>
  </div>

</div>

<script>
// ==================== GAME STATE ====================
const TOTAL_ROUNDS = 10;
const LISTEN_SECONDS = 8;
const MAX_TIME = 15; // seconds per round
const TIMER_INTERVAL = 100; // ms

let songs = [];
let currentRound = 0;
let score = 0;
let correctCount = 0;
let maxRoundScore = 0;
let currentSong = null;
let audio = null;
let timerId = null;
let listenTimerId = null;
let listenedTime = 0;
let roundTimeLeft = MAX_TIME;
let answered = false;
let isPlaying = false;

// ==================== DOM REFS ====================
const $ = id => document.getElementById(id);
const startScreen = $('startScreen');
const loadingScreen = $('loadingScreen');
const gameScreen = $('gameScreen');
const resultScreen = $('resultScreen');
const toast = $('toast');

// ==================== TOAST ====================
let toastTimeout;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ==================== SCREEN SWITCHER ====================
function showScreen(screen) {
  [startScreen, loadingScreen, gameScreen, resultScreen].forEach(s => s.classList.remove('active'));
  screen.classList.add('active');
}

  // Try to fetch additional songs from iTunes API
  const artists = ['周杰伦','林俊杰','邓紫棋','陈奕迅','薛之谦','李荣浩'];
  const artist = artists[Math.floor(Math.random() * artists.length)];

  try {
    const resp = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist)}&limit=15&media=music&country=cn`);
    const data = await resp.json();
    if (data.results && data.results.length > 0) {
      const apiSongs = data.results
        .filter(r => r.previewUrl && r.trackName && r.artistName)
        .map(r => ({
          name: r.trackName,
          artist: r.artistName,
          preview: r.previewUrl,
          art: r.artworkUrl100 || ''
        }));
      songs = [...fallbackSongs, ...apiSongs];
    } else {
      songs = fallbackSongs;
    }
  } catch (e) {
    console.log('iTunes API failed, using fallback songs');
    songs = fallbackSongs;
  }

  // Deduplicate by name
  const seen = new Set();
  songs = songs.filter(s => {
    const key = s.name + s.artist;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  return songs;
}

// ==================== GAME LOGIC ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickSongsForRound(correct, pool, count) {
  const others = pool.filter(s => s.name !== correct.name);
  const shuffled = shuffle(others);
  const distractors = shuffled.slice(0, count - 1);
  const options = shuffle([correct, ...distractors]);
  return options;
}

function stopAudio() {
  if (audio) {
    audio.pause();
    audio.currentTime = 0;
    audio = null;
  }
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (listenTimerId) { clearTimeout(listenTimerId); listenTimerId = null; }
  isPlaying = false;
  listenedTime = 0;
}

function updateEq(bars) {
  bars.forEach(b => b.classList.remove('active'));
  if (isPlaying) {
    bars.forEach(b => b.classList.add('active'));
  }
}

async function startGame() {
  stopAudio();
  showScreen(loadingScreen);

  if (songs.length < 4) {
    await fetchSongs();
  }

  if (songs.length < 4) {
    showToast('歌曲加载失败，请刷新重试');
    showScreen(startScreen);
    return;
  }

  currentRound = 0;
  score = 0;
  correctCount = 0;
  maxRoundScore = 0;

  showScreen(gameScreen);
  $('scoreDisplay').innerHTML = '<span>⭐</span> 0';
  nextRound();
}

function nextRound() {
  stopAudio();
  currentRound++;
  answered = false;
  roundTimeLeft = MAX_TIME;
  listenedTime = 0;

  if (currentRound > TOTAL_ROUNDS) {
    endGame();
    return;
  }

  // Pick a random song
  const available = shuffle(songs);
  currentSong = available[0];

  // Generate options
  const options = pickSongsForRound(currentSong, songs, 4);

  // Update UI
  $('roundBadge').textContent = `第 ${currentRound}/${TOTAL_ROUNDS} 轮`;
  $('playHint').textContent = '点击播放按钮试听歌曲片段';
  $('timerText').textContent = `可试听 ${LISTEN_SECONDS}s · 倒计时 ${MAX_TIME}s`;
  $('timerFill').style.width = '100%';
  $('timerFill').className = 'timer-fill';
  $('btnPlay').textContent = '▶';
  $('btnPlay').classList.remove('playing');
  $('playerCard').classList.remove('playing');
  $('albumArt').classList.remove('playing');
  $('nextArea').innerHTML = '';

  // Album art
  const art = $('albumArt');
  art.innerHTML = '🎧';
  art.querySelector('img')?.remove();
  if (currentSong.art) {
    const img = document.createElement('img');
    img.src = currentSong.art;
    img.onload = () => { art.innerHTML = ''; art.appendChild(img); img.classList.add('loaded'); };
    img.onerror = () => {}; // keep emoji fallback
  }

  // Equalizer
  const eqBars = $('equalizer').querySelectorAll('.eq-bar');
  eqBars.forEach(b => b.classList.remove('active'));

  // Options
  const optsGrid = $('optionsGrid');
  optsGrid.innerHTML = '';
  options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.name;
    btn.onclick = () => selectAnswer(opt, btn);
    optsGrid.appendChild(btn);
  });

  // Start timer
  startTimer();
}

function startTimer() {
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    roundTimeLeft -= TIMER_INTERVAL / 1000;
    const pct = (roundTimeLeft / MAX_TIME) * 100;
    $('timerFill').style.width = Math.max(0, pct) + '%';
    $('timerFill').className = 'timer-fill' + (pct < 30 ? ' danger' : pct < 60 ? ' warning' : '');

    if (!answered) {
      $('timerText').textContent = `已播放 ${Math.floor(listenedTime)}s / 可听 ${LISTEN_SECONDS}s · 倒计时 ${Math.ceil(roundTimeLeft)}s`;
    }

    if (roundTimeLeft <= 0) {
      clearInterval(timerId);
      timerId = null;
      if (!answered) timeUp();
    }
  }, TIMER_INTERVAL);
}

function togglePlay() {
  if (answered) return;
  if (!currentSong?.preview) {
    showToast('无法加载音频');
    return;
  }

  if (isPlaying) {
    stopAudio();
    $('btnPlay').textContent = '▶';
    $('btnPlay').classList.remove('playing');
    $('playerCard').classList.remove('playing');
    $('albumArt').classList.remove('playing');
    updateEq($('equalizer').querySelectorAll('.eq-bar'));
    return;
  }

  if (listenedTime >= LISTEN_SECONDS && !answered) {
    showToast(`已听完 ${LISTEN_SECONDS} 秒，请作答！`);
    return;
  }

  // Start playing
  audio = new Audio(currentSong.preview);
  audio.currentTime = Math.random() * 15; // random start point within 30s preview
  audio.play().catch(e => {
    showToast('播放失败，请重试');
    console.error(e);
  });

  isPlaying = true;
  $('btnPlay').textContent = '⏸';
  $('btnPlay').classList.add('playing');
  $('playerCard').classList.add('playing');
  $('albumArt').classList.add('playing');
  $('playHint').textContent = '正在播放...';
  updateEq($('equalizer').querySelectorAll('.eq-bar'));

  // Track listen time
  const startTime = Date.now();
  if (listenTimerId) clearTimeout(listenTimerId);

  function trackListen() {
    if (!isPlaying) return;
    listenedTime = (Date.now() - startTime) / 1000;
    if (listenedTime >= LISTEN_SECONDS) {
      stopAudio();
      $('btnPlay').textContent = '▶';
      $('btnPlay').classList.remove('playing');
      $('playerCard').classList.remove('playing');
      $('albumArt').classList.remove('playing');
      $('playHint').textContent = '试听结束，请作答！';
      updateEq($('equalizer').querySelectorAll('.eq-bar'));
      return;
    }
    listenTimerId = setTimeout(trackListen, 200);
  }
  trackListen();
}

function selectAnswer(selected, btn) {
  if (answered) return;
  answered = true;
  stopAudio();
  $('playerCard').classList.remove('playing');
  $('albumArt').classList.remove('playing');
  updateEq($('equalizer').querySelectorAll('.eq-bar'));

  const isCorrect = selected.name === currentSong.name;
  const allBtns = $('optionsGrid').querySelectorAll('.option-btn');

  // Disable all buttons
  allBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;

    // Calculate score
    const timeBonus = Math.ceil(roundTimeLeft * 3);
    const roundScore = 10 + timeBonus;
    score += roundScore;
    if (roundScore > maxRoundScore) maxRoundScore = roundScore;

    $('playHint').textContent = `✅ 正确！+${roundScore} 分`;
    $('scoreDisplay').innerHTML = `<span>⭐</span> ${score}`;
  } else {
    btn.classList.add('wrong');
    $('playHint').textContent = '❌ 答错了';

    // Reveal correct answer
    allBtns.forEach(b => {
      if (b.textContent === currentSong.name) b.classList.add('reveal-correct');
    });
  }

  // Show next button or auto-advance
  const isLast = currentRound >= TOTAL_ROUNDS;
  $('nextArea').innerHTML = `
    <button class="btn btn-primary" style="padding:12px 32px;font-size:15px;" onclick="nextRound()">
      ${isLast ? '🏆 查看结果' : '→ 下一题'}
    </button>
  `;
}

function timeUp() {
  if (answered) return;
  answered = true;
  stopAudio();
  $('playerCard').classList.remove('playing');
  $('albumArt').classList.remove('playing');
  updateEq($('equalizer').querySelectorAll('.eq-bar'));

  const allBtns = $('optionsGrid').querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  // Reveal correct answer
  allBtns.forEach(b => {
    if (b.textContent === currentSong.name) b.classList.add('reveal-correct');
  });

  $('playHint').textContent = '⏰ 时间到！';

  const isLast = currentRound >= TOTAL_ROUNDS;
  $('nextArea').innerHTML = `
    <button class="btn btn-primary" style="padding:12px 32px;font-size:15px;" onclick="nextRound()">
      ${isLast ? '🏆 查看结果' : '→ 下一题'}
    </button>
  `;
}

function endGame() {
  stopAudio();
  if (timerId) { clearInterval(timerId); timerId = null; }

  showScreen(resultScreen);
  $('finalScore').textContent = score;
  $('finalCorrect').textContent = `${correctCount}/${TOTAL_ROUNDS}`;
  $('finalMax').textContent = maxRoundScore || 0;

  const rate = correctCount / TOTAL_ROUNDS;
  let icon, title, sub;
  if (rate >= 0.9) { icon = '🏆'; title = '歌神在世！'; sub = '几乎全部答对，太厉害了！'; }
  else if (rate >= 0.7) { icon = '🎉'; title = '音乐达人！'; sub = '很不错的表现！'; }
  else if (rate >= 0.5) { icon = '👍'; title = '还不错！'; sub = '继续加油哦~'; }
  else if (rate >= 0.3) { icon = '🤔'; title = '再接再厉'; sub = '多听听歌再来挑战吧！'; }
  else { icon = '😅'; title = '继续努力'; sub = '音乐世界等着你探索！'; }

  $('resultIcon').textContent = icon;
  $('resultTitle').textContent = title;
  $('resultSubtitle').textContent = sub;
}

// ==================== INIT ====================
// Pre-fetch songs in background
fetchSongs().then(s => { console.log(`Loaded ${s.length} songs`); });
</script>
